name: Test & Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# No job writes to the repository: checkout and test runs only need read
# access, and Codecov authenticates with its own dedicated secret. Declaring
# this explicitly stops the GITHUB_TOKEN from inheriting broader defaults.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: |
          pip install -r requirements-test.txt

      - name: Run tests
        run: pytest

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: aleattene/learning-retention-analytics
